# sites/: only Use lines with plain site/domain names (and LogLevel)
ProxyPass / http://10.0.0.5/
<VirtualHost *:80>
CustomLog /etc/cron.d/evil geo
Use VHost_Proxy evil ../../../tmp http://10.0.0.5/
Use VHost_Proxy ../../../tmp example.com http://10.0.0.5/
Use VHost_Proxy_OIDC_User app example.com/.. http://10.0.0.5/ 'alice'
Use Domain_Init example.com "w w" 'alice'
Define ADMIN_CONFIGTEST
Use VHost_Proxy app ${DOMAIN} http://10.0.0.5/
