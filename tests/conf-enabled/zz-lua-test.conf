# Mounted read-only into /etc/apache2/conf-enabled/ by tests/run-tests.sh.
# Kept out of sites/: the config guard allows only 'Use <macro>' lines there.
# Test-only: unprotected HTTP Lua endpoint for zombie/deadlock regression tests.
# Serves toc.lua without OIDC so mod_lua initialises its LuaScope server state
# in response to a plain curl request — no auth stack needed.
<VirtualHost *:80>
  ServerName lua-test.test.example.com
  DocumentRoot /var/www/html
  AddHandler lua-script .lua
  LuaScope server
  DirectoryIndex toc.lua
  <Directory /var/www/html>
    AllowOverride None
    Require all granted
  </Directory>
</VirtualHost>
