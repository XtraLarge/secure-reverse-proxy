# Root of the user configuration (sites/, AddOn/, config/) that Apache reads.
#
# sites/, AddOn/ and config/ under /etc/apache2 are edited by the admin UI (www-data).
# Apache's master (root) never parses them directly: before every start and reload the
# entrypoint copies them into the root-only snapshot /run/apache2/cfg, runs the config
# guard on that copy and only then lets Apache read it. Later changes by www-data have
# no effect until the next checked snapshot (also not on the nightly log-rotation reload).
#
# The admin UI tests the live files as www-data:  apache2ctl -t -D ADMIN_CONFIGTEST
<IfDefine ADMIN_CONFIGTEST>
  Define CFGROOT /etc/apache2
</IfDefine>
<IfDefine !ADMIN_CONFIGTEST>
  Define CFGROOT /run/apache2/cfg
</IfDefine>
